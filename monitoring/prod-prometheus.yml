global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "eureka-server"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "eureka-server.prod.internal:8761"

  - job_name: "msa-via-eureka"
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: "http://eureka-server.prod.internal:8761/eureka"
        refresh_interval: 30s

    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: service

      - source_labels: [__address__]
        target_label: instance

      - source_labels: [__meta_eureka_app_name]
        regex: "API-GATEWAY|USER-SERVICE|WAITING-SERVICE|RESTAURANT-SERVICE|TIMESLOT-SERVICE|RESERVATION-SERVICE|ORDER-SERVICE|CATALOG-SERVICE|INVENTORY-SERVICE|NOTIFICATION-SERVICE|PAYMENT-SERVICE"
        action: keep
